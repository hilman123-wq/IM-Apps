<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islam Mart - Sistem Manajemen terpadu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .loader { border-top-color: #10b981; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex overflow-hidden">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <div id="global-modal" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md flex flex-col max-h-full">
            <div class="px-6 py-4 border-b flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold text-gray-800">Title</h3>
                <button onclick="closeModal()" class="text-gray-500 hover:text-red-500"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto">
                <!-- Form dynamically injected here -->
            </div>
            <div id="modal-footer" class="px-6 py-4 border-t bg-gray-50 flex justify-end gap-2 rounded-b-lg">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded hover:bg-gray-100">Batal</button>
                <button id="modal-submit-btn" class="px-4 py-2 text-white bg-emerald-600 rounded hover:bg-emerald-700 flex items-center">Simpan</button>
            </div>
        </div>
    </div>

    <div id="login-view" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-emerald-600 to-teal-800">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm fade-in relative">
            <div id="login-loading" class="absolute inset-0 bg-white/80 z-10 hidden flex flex-col items-center justify-center rounded-xl">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
                <p class="text-emerald-700 font-semibold">Menghubungkan ke Supabase...</p>
            </div>

            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                    <i class="fas fa-store"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-800">Islam Mart</h1>
                <p class="text-gray-500 text-sm">Sistem Manajemen Terpadu</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Masukkan username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="Masukkan password">
                </div>
                <button onclick="handleLogin()" class="w-full py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition font-medium">Masuk</button>
            </div>
        </div>
    </div>

    <div id="dashboard-view" class="w-full h-full hidden flex-row">
        <!-- Sidebar -->
        <aside class="w-64 bg-emerald-800 text-white flex flex-col transition-all duration-300 hidden md:flex shrink-0">
            <div class="h-16 flex items-center px-6 border-b border-emerald-700 font-bold text-xl tracking-wider">
                <i class="fas fa-store mr-2"></i> Islam Mart
            </div>
            <div class="p-4 border-b border-emerald-700">
                <p class="text-xs text-emerald-300 uppercase tracking-wide">Login sebagai:</p>
                <p id="sidebar-user-name" class="font-semibold truncate">Nama User</p>
                <p id="sidebar-user-role" class="text-xs text-emerald-200 truncate capitalize">Role</p>
            </div>
            <nav id="sidebar-nav" class="flex-1 overflow-y-auto py-4 space-y-1">
                <!-- Menu items akan di-render di sini via JS -->
            </nav>
            <div class="p-4 border-t border-emerald-700">
                <button onclick="handleLogout()" class="w-full flex items-center py-2 px-4 text-emerald-200 hover:text-white hover:bg-emerald-700 rounded transition">
                    <i class="fas fa-sign-out-alt w-5"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full bg-gray-50 overflow-hidden">
            <!-- Header Mobile & Global -->
            <header class="h-16 bg-white border-b flex items-center justify-between px-4 sm:px-6 shrink-0">
                <div class="flex items-center">
                    <h2 id="page-title" class="text-xl font-bold text-gray-800">Dashboard</h2>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </header>

            <!-- Reminder Banner -->
            <div id="reminder-banner" class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4 shrink-0 shadow-sm hidden">
                <p class="font-bold flex items-center"><i class="fas fa-exclamation-triangle mr-2"></i> Pengingat!</p>
                <p id="reminder-text" class="text-sm mt-1">Harap isi form ceklis harian. Laporan bulanan maksimal tanggal 3.</p>
            </div>

            <!-- Content Area -->
            <div id="main-content" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 relative">
                <!-- Konten dinamis masuk kesini -->
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // 1. SETUP KONFIGURASI SUPABASE
        // ==========================================
        // GANTI DENGAN URL & ANON KEY DARI DASHBOARD SUPABASE ANDA
        const SUPABASE_URL = 'https://mizxtztttcbicqynfctb.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1penh0enR0dGNiaWNxeW5mY3RiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjA5MzksImV4cCI6MjEwNTEzNjkzOX0.LpC9qWCCu8qIPNahZWBz1UtFokLxu9DhemBBYCtgZJU'; 

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Application State
        let currentUser = null;
        let activeMenu = 'dashboard';
        
        // Modal Variables
        let currentModalContext = null;
        let currentEditingId = null;
        let cachedDataForEdit = null; // Menyimpan sementara data spesifik untuk diedit

        // Template Indikator Ceklis berdasarkan Role
        const indicatorTemplates = {
            kasir: ["Membersihkan Toko", "Melayani Konsumen", "Display Barang", "Kedisiplinan", "Pro Aktif"],
            gudang: ["Cek Stok Gudang", "Cek Surat Jalan", "Melakukan Pembagian Tugas"],
            keuangan: ["Rekap Harian", "Cek Bukti Bayar", "Laporan Kas"]
        };

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-green-100 text-green-800 border-green-200',
                error: 'bg-red-100 text-red-800 border-red-200',
                info: 'bg-blue-100 text-blue-800 border-blue-200'
            };
            
            toast.className = `p-4 rounded-lg border shadow-md flex items-center fade-in ${colors[type]} z-50`;
            toast.innerHTML = `<span class="font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-500');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function showLoading() {
            document.getElementById('main-content').innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-gray-500">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mb-4"></div>
                    <p>Memuat data dari Supabase...</p>
                </div>`;
        }

        async function handleLogin() {
            const userIn = document.getElementById('username').value;
            const passIn = document.getElementById('password').value;
            
            if(!userIn || !passIn) return showToast('Harap isi semua bidang', 'error');

            document.getElementById('login-loading').classList.remove('hidden');

            try {
                // Query ke tabel users
                const { data, error } = await supabase
                    .from('users')
                    .select('*')
                    .eq('username', userIn)
                    .eq('password', passIn)
                    .single();

                if (error || !data) throw error || new Error('User tidak ditemukan');

                currentUser = data;
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                
                document.getElementById('sidebar-user-name').innerText = data.full_name;
                document.getElementById('sidebar-user-role').innerText = `Dept: ${data.department.toUpperCase()} - ${data.role.toUpperCase()}`;
                
                setupDashboard();
                showToast(`Selamat datang, ${data.full_name}`);
            } catch (error) {
                console.error("Login Error:", error);
                showToast('Username atau password salah / Koneksi Gagal', 'error');
            } finally {
                document.getElementById('login-loading').classList.add('hidden');
            }
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        function setupDashboard() {
            const nav = document.getElementById('sidebar-nav');
            let menus = [{ id: 'dashboard', icon: 'fa-home', label: 'Dashboard Utama' }];

            if (currentUser.role === 'kepala') {
                menus.push({ id: 'reports', icon: 'fa-chart-bar', label: 'Laporan Karyawan' });
                menus.push({ id: 'approvals', icon: 'fa-check-circle', label: 'Persetujuan Harga & Vendor' });
            } 
            else if (currentUser.role === 'keuangan') {
                menus.push({ id: 'checklists', icon: 'fa-clipboard-list', label: 'Ceklis Harian' });
                menus.push({ id: 'price_proposals', icon: 'fa-tags', label: 'Pengajuan Harga Jual' });
                menus.push({ id: 'payments', icon: 'fa-money-bill-wave', label: 'Pembayaran Supplier' });
                menus.push({ id: 'reports_upload', icon: 'fa-upload', label: 'Upload Laporan' });
            }
            else if (currentUser.role === 'gudang') {
                menus.push({ id: 'checklists', icon: 'fa-clipboard-list', label: 'Ceklis Harian' });
                menus.push({ id: 'orders_manage', icon: 'fa-boxes', label: 'Kelola Order & Vendor' });
                menus.push({ id: 'price_proposals', icon: 'fa-tags', label: 'Pengajuan Harga Beli' });
                menus.push({ id: 'master_data', icon: 'fa-database', label: 'Master Data (Brg/Spl)' });
                menus.push({ id: 'reports_upload', icon: 'fa-upload', label: 'Upload Laporan' });
            }
            else if (currentUser.role === 'kasir') {
                menus.push({ id: 'checklists', icon: 'fa-clipboard-list', label: 'Ceklis Harian' });
                menus.push({ id: 'orders', icon: 'fa-shopping-cart', label: 'Order ke Gudang' });
                menus.push({ id: 'print_labels', icon: 'fa-print', label: 'Cetak Label Harga' });
            }

            nav.innerHTML = menus.map(m => `
                <a href="#" onclick="loadView('${m.id}')" class="flex items-center px-6 py-3 text-emerald-100 hover:bg-emerald-700 hover:text-white transition">
                    <i class="fas ${m.icon} w-6"></i>
                    <span>${m.label}</span>
                </a>
            `).join('');

            const banner = document.getElementById('reminder-banner');
            const reminderText = document.getElementById('reminder-text');
            banner.classList.remove('hidden');

            if (currentUser.role === 'kasir') {
                reminderText.innerText = "Jangan lupa isi Ceklis Harian dan Orderan Rutin (Minggu & Senin). Laporan Ceklis dikirim tiap tgl 30.";
            } else if (currentUser.role === 'kepala') {
                banner.classList.add('hidden');
            } else {
                reminderText.innerText = "Harap isi Ceklis Harian. Laporan bulanan maksimal diupload tanggal 3.";
            }

            loadView('dashboard');
        }

        function loadView(viewId) {
            activeMenu = viewId;
            const content = document.getElementById('main-content');
            document.getElementById('page-title').innerText = viewId.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
            
            showLoading(); // Tampilkan loading sebelum fetch Supabase

            setTimeout(() => {
                switch(viewId) {
                    case 'dashboard': renderDashboardHome(content); break;
                    case 'master_data': renderMasterData(content); break;
                    case 'orders': renderOrdersKasir(content); break;
                    case 'orders_manage': renderOrdersGudang(content); break;
                    case 'checklists': renderChecklists(content); break;
                    case 'price_proposals': renderPriceProposals(content); break;
                    case 'approvals': renderApprovals(content); break;
                    case 'payments': renderPayments(content); break;
                    case 'print_labels': renderPrintLabels(content); break;
                    case 'reports': 
                    case 'reports_upload': renderReportsPlaceholder(content, viewId); break;
                    default: content.innerHTML = `<div class="p-6 bg-white rounded shadow text-center">Dalam pengembangan.</div>`;
                }
            }, 100);
        }

        async function renderDashboardHome(container) {
            try {
                // Fetch basic stats
                let itemQuery = supabase.from('items').select('id', { count: 'exact' });
                if (currentUser.department !== 'pusat') itemQuery = itemQuery.eq('department', currentUser.department);
                const { count: itemsCount } = await itemQuery;

                const { count: ordersCount } = await supabase.from('orders').select('id', { count: 'exact' }).eq('status', 'pending');
                const { count: checklistsCount } = await supabase.from('checklists').select('id', { count: 'exact' }).eq('checklist_date', new Date().toISOString().split('T')[0]);

                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 fade-in">
                        <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-emerald-500">
                            <h3 class="text-gray-500 text-sm font-medium">Total Barang Aktif</h3>
                            <p class="text-3xl font-bold text-gray-800 mt-2">${itemsCount || 0}</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-blue-500">
                            <h3 class="text-gray-500 text-sm font-medium">Orderan Tertunda</h3>
                            <p class="text-3xl font-bold text-gray-800 mt-2">${ordersCount || 0}</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-yellow-500">
                            <h3 class="text-gray-500 text-sm font-medium">Ceklis Selesai Hari Ini</h3>
                            <p class="text-3xl font-bold text-gray-800 mt-2">${checklistsCount || 0}</p>
                        </div>
                    </div>
                    <div class="mt-8 bg-white p-6 rounded-xl shadow-sm fade-in">
                        <h3 class="text-lg font-bold mb-4">Selamat datang di Panel ${currentUser.role.toUpperCase()} ${currentUser.department.toUpperCase()}</h3>
                        <p class="text-gray-600">Terhubung langsung ke database Supabase.</p>
                    </div>
                `;
            } catch(e) {
                container.innerHTML = `<div class="p-4 text-red-500">Gagal memuat dashboard: ${e.message}</div>`;
            }
        }

        async function renderMasterData(container) {
            try {
                const { data: items } = await supabase.from('items').select('*').eq('department', currentUser.department).order('created_at', { ascending: false });
                const { data: suppliers } = await supabase.from('suppliers').select('*').eq('department', currentUser.department).order('created_at', { ascending: false });

                const itemsCols = [
                    { key: 'barcode', label: 'Barcode' },
                    { key: 'name', label: 'Nama Barang' },
                    { key: 'buy_price', label: 'Harga Beli', format: 'currency' },
                    { key: 'sell_price', label: 'Harga Jual', format: 'currency' }
                ];
                const suppliersCols = [
                    { key: 'name', label: 'Nama Supplier' },
                    { key: 'wa_number', label: 'Kontak (WA)' }
                ];

                container.innerHTML = `
                    <div class="space-y-8 fade-in">
                        ${createTable('Data Barang', itemsCols, items || [], 'items', ['create', 'edit', 'delete'])}
                        ${createTable('Data Supplier', suppliersCols, suppliers || [], 'suppliers', ['create', 'edit', 'delete'])}
                    </div>
                `;
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function renderOrdersKasir(container) {
            try {
                const { data } = await supabase.from('orders')
                    .select('*, items(name)')
                    .eq('from_user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                // Map relasi items
                const mappedData = data?.map(d => ({...d, item_name: d.items?.name, date: d.created_at.split('T')[0] })) || [];
                
                const cols = [
                    { key: 'date', label: 'Tanggal' },
                    { key: 'item_name', label: 'Barang' },
                    { key: 'quantity', label: 'Qty' },
                    { key: 'status', label: 'Status', format: 'status' }
                ];
                container.innerHTML = `<div class="fade-in">${createTable('Histori Order ke Gudang', cols, mappedData, 'orders', ['create', 'delete'])}</div>`;
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function renderOrdersGudang(container) {
            try {
                const { data } = await supabase.from('orders')
                    .select('*, items(name), users(full_name)')
                    .eq('department', currentUser.department)
                    .order('created_at', { ascending: false });

                const mappedData = data?.map(d => ({
                    ...d, 
                    item_name: d.items?.name, 
                    user_name: d.users?.full_name,
                    date: d.created_at.split('T')[0] 
                })) || [];
                
                const cols = [
                    { key: 'date', label: 'Tanggal' },
                    { key: 'user_name', label: 'Pemesan' },
                    { key: 'item_name', label: 'Barang' },
                    { key: 'quantity', label: 'Qty' },
                    { key: 'status', label: 'Status', format: 'status' }
                ];
                
                const customActions = [
                    { label: 'Setujui', color: 'green', fn: 'updateStatus', arg: 'approved' },
                    { label: 'Tolak', color: 'red', fn: 'updateStatus', arg: 'rejected' }
                ];

                container.innerHTML = `<div class="fade-in">${createTable('Kelola Orderan (Kasir / Vendor)', cols, mappedData, 'orders', ['create'], customActions)}</div>`;
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function renderChecklists(container) {
            try {
                let query = supabase.from('checklists').select('*, users(full_name)').order('checklist_date', { ascending: false });
                
                // Kepala lihat semua, yang lain lihat milik sendiri / departemennya (tergantung kebutuhan, disini own data)
                if (currentUser.role !== 'kepala') {
                    query = query.eq('user_id', currentUser.id);
                }

                const { data } = await query;
                const mappedData = data?.map(d => ({...d, user_name: d.users?.full_name })) || [];

                const cols = [
                    { key: 'checklist_date', label: 'Tanggal' },
                    { key: 'user_name', label: 'Karyawan' },
                    { key: 'score', label: 'Skor Ceklis', format: 'status' },
                    { key: 'notes', label: 'Catatan' }
                ];

                container.innerHTML = `<div class="fade-in">${createTable('Laporan Ceklis Harian', cols, mappedData, 'checklists', ['create', 'delete'])}</div>`;
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function renderPriceProposals(container) {
             try {
                const { data } = await supabase.from('price_proposals')
                    .select('*, items(name)')
                    .eq('proposed_by', currentUser.id)
                    .order('created_at', { ascending: false });

                const mappedData = data?.map(d => ({...d, item_name: d.items?.name })) || [];
                
                const cols = [
                    { key: 'item_name', label: 'Barang' },
                    { key: 'proposal_type', label: 'Jenis (Buy/Sell)' },
                    { key: 'old_price', label: 'Harga Lama', format: 'currency' },
                    { key: 'new_price', label: 'Harga Baru', format: 'currency' },
                    { key: 'status', label: 'Status', format: 'status' }
                ];
                container.innerHTML = `<div class="fade-in">${createTable('Riwayat Pengajuan Harga', cols, mappedData, 'price_proposals', ['create', 'delete'])}</div>`;
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function renderApprovals(container) {
            try {
                // Kepala terima usulan 'sell_price'. Keuangan (di masa depan) terima 'buy_price'.
                const targetType = currentUser.role === 'kepala' ? 'sell_price' : 'buy_price';
                
                const { data } = await supabase.from('price_proposals')
                    .select('*, items(name), users(full_name)')
                    .eq('proposal_type', targetType)
                    .order('created_at', { ascending: false });

                const mappedData = data?.map(d => ({...d, item_name: d.items?.name, user_name: d.users?.full_name })) || [];
                
                const cols = [
                    { key: 'user_name', label: 'Pengaju' },
                    { key: 'item_name', label: 'Barang' },
                    { key: 'new_price', label: 'Harga Baru', format: 'currency' },
                    { key: 'status', label: 'Status', format: 'status' }
                ];
                
                const actions = [
                    { label: 'Setuju', color: 'green', fn: 'updateStatus', arg: 'approved' },
                    { label: 'Tolak', color: 'red', fn: 'updateStatus', arg: 'rejected' }
                ];

                container.innerHTML = `<div class="fade-in">${createTable('Persetujuan Masuk', cols, mappedData, 'price_proposals', [], actions)}</div>`;
            } catch (e) { showToast(e.message, 'error'); }
        }
        
        async function renderPayments(container) {
            container.innerHTML = `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center fade-in">
                    <i class="fas fa-file-invoice-dollar text-5xl text-emerald-300 mb-4"></i>
                    <h3 class="text-lg font-bold mb-2">Modul Pembayaran Supplier & Cetak Nota</h3>
                    <p class="text-gray-500 mb-4">Pilih tagihan dari gudang untuk dilakukan pembayaran.</p>
                    <button class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700" onclick="showToast('Simulasi Cetak Nota Berhasil', 'info')">Cetak Bukti Bayar</button>
                </div>`;
        }

        async function renderPrintLabels(container) {
             try {
                const { data: items } = await supabase.from('items').select('*').eq('department', currentUser.department);
                
                let html = `<div class="grid grid-cols-2 md:grid-cols-4 gap-4 fade-in">`;
                (items || []).forEach(item => {
                    html += `
                        <div class="border-2 border-dashed border-gray-300 p-4 flex flex-col items-center justify-center bg-white rounded cursor-pointer hover:border-emerald-500" onclick="showToast('Label ${item.name} dikirim ke printer!', 'success')">
                            <i class="fas fa-barcode text-3xl mb-2 text-gray-700"></i>
                            <p class="text-xs text-center font-bold">${item.name}</p>
                            <p class="text-sm font-bold text-emerald-600">Rp ${Number(item.sell_price).toLocaleString('id-ID')}</p>
                            <button class="mt-2 text-xs bg-gray-200 px-2 py-1 rounded w-full">Print</button>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML = html;
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function renderReportsPlaceholder(container, type) {
            const title = type === 'reports' ? 'Laporan Karyawan & Bulanan' : 'Upload Laporan Bulanan';
            container.innerHTML = `
                <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center justify-center fade-in">
                    <i class="fas fa-file-excel text-6xl text-emerald-500 mb-4"></i>
                    <h3 class="text-xl font-bold mb-2">${title}</h3>
                    <p class="text-gray-500 text-center max-w-md mb-6">Integrasikan Storage Supabase disini untuk mengupload format Laporan Neraca, Laba Rugi, dll.</p>
                    ${type === 'reports_upload' 
                        ? `<button class="bg-emerald-600 text-white px-6 py-2 rounded-lg hover:bg-emerald-700 shadow flex items-center" onclick="showToast('Fitur Storage Supabase belum disetting.')"><i class="fas fa-upload mr-2"></i> Pilih File Laporan</button>`
                        : `<div class="space-x-2">
                            <button class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700" onclick="showToast('Unduh')"><i class="fas fa-download mr-1"></i> Laporan</button>
                           </div>`
                    }
                </div>
            `;
        }

        function createTable(title, columns, data, context, actions = ['edit', 'delete'], customActions = []) {
            let html = `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 class="font-bold text-gray-800">${title}</h3>
                        ${actions.includes('create') ? `<button onclick="openModal('Tambah ${title}', '${context}')" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-sm hover:bg-emerald-700"><i class="fas fa-plus mr-1"></i> Tambah</button>` : ''}
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                                    ${columns.map(col => `<th class="px-6 py-3 border-b">${col.label}</th>`).join('')}
                                    ${actions.length > 0 || customActions.length > 0 ? `<th class="px-6 py-3 border-b text-right">Aksi</th>` : ''}
                                </tr>
                            </thead>
                            <tbody class="text-sm divide-y divide-gray-100">
            `;
            
            if (data.length === 0) {
                html += `<tr><td colspan="10" class="px-6 py-8 text-center text-gray-400">Tidak ada data tersedia</td></tr>`;
            }

            data.forEach(row => {
                html += `<tr class="hover:bg-gray-50">`;
                columns.forEach(col => {
                    let val = row[col.key] || '-';
                    if(col.format === 'currency') val = 'Rp ' + Number(val).toLocaleString('id-ID');
                    if(col.format === 'status') {
                        let color = (val === 'Selesai' || val === 'approved') ? 'bg-green-100 text-green-800' : (val === 'rejected' ? 'bg-red-100 text-red-800' : 'bg-yellow-100 text-yellow-800');
                        val = `<span class="px-2 py-1 rounded text-xs font-medium ${color}">${val}</span>`;
                    }
                    html += `<td class="px-6 py-3">${val}</td>`;
                });
                
                if(actions.length > 0 || customActions.length > 0) {
                    html += `<td class="px-6 py-3 text-right space-x-2">`;
                    customActions.forEach(btn => {
                         html += `<button onclick="${btn.fn}('${context}', '${row.id}', '${btn.arg || ''}')" class="text-xs px-2 py-1 rounded bg-${btn.color}-100 text-${btn.color}-700 hover:bg-${btn.color}-200">${btn.label}</button>`;
                    });
                    if(actions.includes('edit')) html += `<button onclick="openModal('Edit Data', '${context}', '${row.id}')" class="text-blue-500 hover:text-blue-700 px-1"><i class="fas fa-edit"></i></button>`;
                    if(actions.includes('delete')) html += `<button onclick="deleteData('${context}', '${row.id}')" class="text-red-500 hover:text-red-700 px-1"><i class="fas fa-trash"></i></button>`;
                    html += `</td>`;
                }
                html += `</tr>`;
            });

            html += `</tbody></table></div></div>`;
            return html;
        }

        async function openModal(title, context, id = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('global-modal').classList.remove('hidden');
            currentModalContext = context;
            currentEditingId = id;
            cachedDataForEdit = null;
            
            const body = document.getElementById('modal-body');
            body.innerHTML = '<div class="text-center py-4"><i class="fas fa-circle-notch fa-spin text-emerald-600"></i> Memuat form...</div>';

            try {
                if (id) {
                    const { data, error } = await supabase.from(context).select('*').eq('id', id).single();
                    if(error) throw error;
                    cachedDataForEdit = data;
                }
                body.innerHTML = await generateFormHtml(context, cachedDataForEdit);
            } catch (e) {
                body.innerHTML = `<div class="text-red-500">Error memuat data: ${e.message}</div>`;
            }
        }

        function closeModal() {
            document.getElementById('global-modal').classList.add('hidden');
            currentModalContext = null;
            currentEditingId = null;
            cachedDataForEdit = null;
        }

        async function generateFormHtml(context, data) {
            let html = '<div class="space-y-4">';
            
            // Reusable dropdown for items
            const { data: items } = await supabase.from('items').select('id, name').eq('department', currentUser.department);
            let itemOptions = (items || []).map(i => `<option value="${i.id}" ${data && data.item_id === i.id ? 'selected' : ''}>${i.name}</option>`).join('');

            switch(context) {
                case 'items':
                    html += `
                        <div><label class="text-sm font-medium">Barcode</label><input type="text" id="frm-barcode" class="w-full border p-2 rounded" value="${data ? data.barcode : ''}"></div>
                        <div><label class="text-sm font-medium">Nama Barang</label><input type="text" id="frm-name" class="w-full border p-2 rounded" value="${data ? data.name : ''}"></div>
                        <div><label class="text-sm font-medium">Harga Beli</label><input type="number" id="frm-buy" class="w-full border p-2 rounded" value="${data ? data.buy_price : ''}"></div>
                        <div><label class="text-sm font-medium">Harga Jual</label><input type="number" id="frm-sell" class="w-full border p-2 rounded" value="${data ? data.sell_price : ''}"></div>
                    `;
                    break;
                case 'suppliers':
                    html += `
                        <div><label class="text-sm font-medium">Nama Supplier</label><input type="text" id="frm-name" class="w-full border p-2 rounded" value="${data ? data.name : ''}"></div>
                        <div><label class="text-sm font-medium">Kontak/WA</label><input type="text" id="frm-contact" class="w-full border p-2 rounded" value="${data ? data.wa_number : ''}"></div>
                    `;
                    break;
                case 'orders':
                    html += `
                        <div><label class="text-sm font-medium">Pilih Barang</label>
                            <select id="frm-item_id" class="w-full border p-2 rounded"><option value="">-- Pilih Barang --</option>${itemOptions}</select>
                        </div>
                        <div><label class="text-sm font-medium">Jumlah / Qty</label><input type="number" id="frm-qty" class="w-full border p-2 rounded" value="${data ? data.quantity : ''}"></div>
                    `;
                    break;
                case 'checklists':
                    const roles = indicatorTemplates[currentUser.role] || [];
                    html += `<div class="mb-2 font-bold text-sm text-gray-800 border-b pb-2">Indikator Ceklis Harian (${currentUser.role.toUpperCase()})</div>`;
                    
                    // Parse existing JSONB indicators if editing
                    let savedIndicators = data && data.indicators ? (typeof data.indicators === 'string' ? JSON.parse(data.indicators) : data.indicators) : null;

                    roles.forEach((taskName, i) => {
                        let isChecked = savedIndicators ? savedIndicators.find(ind => ind.task === taskName)?.done : false;
                        html += `
                        <div class="flex items-start mb-2">
                            <input type="checkbox" id="chk-${i}" value="${taskName}" ${isChecked ? 'checked' : ''} class="mt-1 mr-3 h-4 w-4 text-emerald-600 rounded border-gray-300 chk-indicator cursor-pointer">
                            <label for="chk-${i}" class="text-sm text-gray-700 cursor-pointer leading-tight">${taskName}</label>
                        </div>`;
                    });

                    html += `
                        <div class="mt-4"><label class="text-sm font-medium">Catatan Tambahan</label><textarea id="frm-notes" class="w-full border p-2 rounded rows="3">${data && data.notes ? data.notes : ''}</textarea></div>
                    `;
                    break;
                case 'price_proposals':
                     html += `
                        <div><label class="text-sm font-medium">Pilih Barang</label>
                            <select id="frm-item_id" class="w-full border p-2 rounded"><option value="">-- Pilih Barang --</option>${itemOptions}</select>
                        </div>
                        <div><label class="text-sm font-medium">Harga Usulan</label><input type="number" id="frm-new" class="w-full border p-2 rounded" value="${data ? data.new_price : ''}"></div>
                    `;
                    break;
            }
            html += '</div>';
            return html;
        }

        document.getElementById('modal-submit-btn').addEventListener('click', async (e) => {
            if(!currentModalContext) return;
            
            const btn = e.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Proses...';
            btn.disabled = true;

            let newData = {};
            
            try {
                if(currentModalContext === 'items') {
                    newData = { barcode: document.getElementById('frm-barcode').value, name: document.getElementById('frm-name').value, buy_price: document.getElementById('frm-buy').value, sell_price: document.getElementById('frm-sell').value, department: currentUser.department };
                } else if(currentModalContext === 'suppliers') {
                    newData = { name: document.getElementById('frm-name').value, wa_number: document.getElementById('frm-contact').value, department: currentUser.department };
                } else if(currentModalContext === 'orders') {
                    newData = { item_id: document.getElementById('frm-item_id').value, quantity: document.getElementById('frm-qty').value, from_user_id: currentUser.id, department: currentUser.department, order_type: currentUser.role === 'kasir' ? 'kasir_to_gudang' : 'gudang_to_vendor' };
                } else if(currentModalContext === 'checklists') {
                    const checkboxes = document.querySelectorAll('.chk-indicator');
                    let completedCount = 0;
                    let indicatorsJson = [];
                    
                    checkboxes.forEach(chk => {
                        let isDone = chk.checked;
                        if(isDone) completedCount++;
                        indicatorsJson.push({ task: chk.value, done: isDone });
                    });
                    
                    newData = { 
                        indicators: indicatorsJson,
                        notes: document.getElementById('frm-notes').value, 
                        checklist_date: new Date().toISOString().split('T')[0], 
                        user_id: currentUser.id, 
                        department: currentUser.department, 
                        score: `${completedCount}/${checkboxes.length} Selesai` 
                    };
                } else if(currentModalContext === 'price_proposals') {
                    newData = { item_id: document.getElementById('frm-item_id').value, new_price: document.getElementById('frm-new').value, proposal_type: currentUser.role === 'gudang' ? 'buy_price' : 'sell_price', proposed_by: currentUser.id };
                }

                if (currentEditingId) {
                    const { error } = await supabase.from(currentModalContext).update(newData).eq('id', currentEditingId);
                    if (error) throw error;
                    showToast('Data berhasil diperbarui!');
                } else {
                    const { error } = await supabase.from(currentModalContext).insert([newData]);
                    if (error) throw error;
                    showToast('Data berhasil ditambahkan!');
                }
                
                closeModal();
                loadView(activeMenu); 
            } catch(error) {
                showToast(`Gagal: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        async function deleteData(table, id) {
            try {
                // Menampilkan loader sementara
                showLoading();
                const { error } = await supabase.from(table).delete().eq('id', id);
                if(error) throw error;
                
                showToast('Data berhasil dihapus');
                loadView(activeMenu);
            } catch (error) {
                showToast(`Gagal hapus: ${error.message}`, 'error');
                loadView(activeMenu); // Reload to reset state
            }
        }

        async function updateStatus(table, id, newStatus) {
            try {
                showLoading();
                const { error } = await supabase.from(table).update({ status: newStatus }).eq('id', id);
                if(error) throw error;
                
                showToast(`Status berhasil diubah menjadi: ${newStatus}`);
                loadView(activeMenu);
            } catch (error) {
                showToast(`Gagal update status: ${error.message}`, 'error');
                loadView(activeMenu);
            }
        }

    </script>
</body>
</html>
